<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legend of Kingdom: The Astral Vessel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            overflow: hidden;
            background: #02060d;
            font-family: 'Cinzel', serif;
            color: #fff;
            width: 100vw;
            height: 100vh;
        }

        canvas#bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* Ambient rotating light rays */
        .light-rays {
            position: fixed;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg at 50% 50%,
                transparent 0deg,
                rgba(120, 200, 255, 0.03) 10deg,
                transparent 20deg,
                transparent 60deg,
                rgba(120, 200, 255, 0.02) 75deg,
                transparent 90deg,
                transparent 140deg,
                rgba(140, 220, 255, 0.03) 155deg,
                transparent 170deg,
                transparent 240deg,
                rgba(100, 190, 255, 0.025) 255deg,
                transparent 270deg,
                transparent 320deg,
                rgba(120, 200, 255, 0.02) 335deg,
                transparent 350deg
            );
            animation: rotateRays 90s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes rotateRays {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(1, 4, 10, 0.85) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, #b8e2ff 0%, rgba(120, 200, 255, 0.8) 50%, transparent 100%);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) translateX(0) scale(0.2);
                opacity: 0;
            }
            15% {
                opacity: 0.9;
            }
            85% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-10vh) translateX(var(--drift)) scale(1.2);
                opacity: 0;
            }
        }

        /* Title Screen Content Container */
        .title-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 4;
        }

        /* Logo Container & Image */
        .logo-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            animation: logoIntro 2.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.2s ease-out;
        }

        @keyframes logoIntro {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(30px);
                filter: blur(12px) brightness(1.8);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0) brightness(1);
            }
        }

        /* Main PNG Logo Styling */
        .title-logo-img {
            max-width: 680px;
            width: 75vw;
            height: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 25px rgba(110, 195, 255, 0.55))
                    drop-shadow(0 0 60px rgba(70, 150, 255, 0.25))
                    drop-shadow(0 15px 25px rgba(0, 0, 0, 0.8));
            animation: logoBreathe 5s ease-in-out infinite alternate;
        }

        @keyframes logoBreathe {
            0% {
                filter: drop-shadow(0 0 20px rgba(110, 195, 255, 0.45))
                        drop-shadow(0 0 50px rgba(70, 150, 255, 0.2))
                        drop-shadow(0 15px 25px rgba(0, 0, 0, 0.8));
            }
            100% {
                filter: drop-shadow(0 0 35px rgba(140, 215, 255, 0.75))
                        drop-shadow(0 0 80px rgba(90, 175, 255, 0.4))
                        drop-shadow(0 15px 30px rgba(0, 0, 0, 0.9));
            }
        }

        /* Decorative line under the logo */
        .botw-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
            max-width: 480px;
            opacity: 0.8;
        }

        .botw-divider .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #78c8ff, transparent);
        }

        .botw-divider .diamond {
            color: #a5dcff;
            font-size: 10px;
            text-shadow: 0 0 10px #78c8ff;
        }

        /* "Press Any Key" Prompt */
        .press-start {
            position: absolute;
            bottom: 120px;
            font-family: 'Cinzel', serif;
            font-size: 19px;
            letter-spacing: 9px;
            color: #d6eeff;
            text-shadow: 0 0 20px rgba(130, 205, 255, 0.7),
                         0 0 40px rgba(70, 160, 255, 0.4);
            animation: pulsePrompt 2.6s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s;
        }

        @keyframes pulsePrompt {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 0.25; transform: scale(0.98); }
        }

        /* Main Menu */
        .menu {
            position: absolute;
            bottom: 95px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            animation: menuFade 0.6s ease-out forwards;
        }

        @keyframes menuFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-item {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            letter-spacing: 6px;
            color: #8bbdd8;
            cursor: pointer;
            padding: 6px 25px;
            transition: all 0.25s ease;
            position: relative;
        }

        .menu-item:hover {
            color: #ffffff;
            text-shadow: 0 0 18px rgba(120, 210, 255, 0.9),
                         0 0 35px rgba(80, 180, 255, 0.6);
            transform: translateX(6px);
        }

        .menu-item:hover::before {
            content: '◆';
            position: absolute;
            left: 2px;
            font-size: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #78c8ff;
            text-shadow: 0 0 10px #78c8ff;
        }

        /* Copyright notice */
        .copyright {
            position: absolute;
            bottom: 22px;
            font-size: 10px;
            letter-spacing: 4px;
            color: rgba(140, 195, 230, 0.4);
            text-transform: uppercase;
        }

        /* White screen flash on start */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.2s ease-out;
        }

        .flash-overlay.active {
            opacity: 0.35;
            transition: opacity 0.05s ease-in;
        }
    </style>
</head>
<body>

    <!-- Dynamic Animated Sky Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Visual Atmosphere FX -->
    <div class="light-rays"></div>
    <div class="vignette"></div>
    <div class="particles" id="particles"></div>

    <!-- Main Title Content -->
    <div class="title-screen">
        <div class="logo-container" id="logoContainer">
            <!-- PNG Logo File -->
            <img 
                src="Legend of Kingdom The Astral Vessel.png" 
                alt="Legend of Kingdom The Astral Vessel" 
                class="title-logo-img"
                id="logoImg"
            />
            
            <div class="botw-divider">
                <div class="line"></div>
                <div class="diamond">◆</div>
                <div class="line"></div>
            </div>
        </div>

        <div class="press-start" id="pressStart">PRESS ANY KEY</div>

        <div class="menu" id="menu">
            <div class="menu-item" onclick="selectOption('CONTINUE')">CONTINUE</div>
            <div class="menu-item" onclick="selectOption('NEW GAME')">NEW GAME</div>
            <div class="menu-item" onclick="selectOption('OPTIONS')">OPTIONS</div>
        </div>

        <div class="copyright">© 2024 THE LEGEND OF KINGDOM</div>
    </div>

    <div class="flash-overlay" id="flash"></div>

    <script>
        // ================= BACKGROUND CANVAS RENDERING =================
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Starfield
        const stars = [];
        for (let i = 0; i < 220; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.75,
                size: Math.random() * 1.8 + 0.4,
                speed: Math.random() * 0.02 + 0.005,
                phase: Math.random() * Math.PI * 2,
                baseAlpha: Math.random() * 0.6 + 0.3
            });
        }

        // Draw Layered Breath of the Wild style silhouettes
        function drawMountains(time) {
            const w = canvas.width;
            const h = canvas.height;

            // Far Mountain Layer
            ctx.beginPath();
            ctx.moveTo(0, h * 0.78);
            for (let x = 0; x <= w; x += 3) {
                let y = h * 0.62 - 
                        Math.sin(x * 0.0022) * 85 - 
                        Math.sin(x * 0.006 + 1.2) * 45 - 
                        Math.sin(x * 0.0008 + 2.5) * 65;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fillStyle = '#061326';
            ctx.fill();

            // Mid Mountain Layer
            ctx.beginPath();
            ctx.moveTo(0, h * 0.85);
            for (let x = 0; x <= w; x += 3) {
                let y = h * 0.72 - 
                        Math.sin(x * 0.004 + 3) * 55 - 
                        Math.sin(x * 0.01 + 0.5) * 30;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fillStyle = '#030c1a';
            ctx.fill();

            // Foreground Ridge
            ctx.beginPath();
            ctx.moveTo(0, h * 0.9);
            for (let x = 0; x <= w; x += 4) {
                let y = h * 0.86 - Math.sin(x * 0.006 + 2) * 20;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fillStyle = '#01050c';
            ctx.fill();
        }

        // Animated Sky & Aurora
        function drawScene(time) {
            const w = canvas.width;
            const h = canvas.height;

            // Deep Celestial Sky Gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, h);
            skyGrad.addColorStop(0.0, '#02050d');
            skyGrad.addColorStop(0.4, '#07152b');
            skyGrad.addColorStop(0.7, '#0d264a');
            skyGrad.addColorStop(1.0, '#030a14');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h);

            // Twinkling Stars
            stars.forEach(s => {
                let alpha = s.baseAlpha * (0.6 + 0.4 * Math.sin(time * s.speed + s.phase));
                ctx.beginPath();
                ctx.arc(s.x * w, s.y * h, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(215, 235, 255, ${alpha})`;
                ctx.fill();
            });

            // Ambient Central Aura behind the Logo
            let centerGlow = ctx.createRadialGradient(w / 2, h * 0.42, 40, w / 2, h * 0.42, 420);
            centerGlow.addColorStop(0, 'rgba(75, 160, 245, 0.12)');
            centerGlow.addColorStop(0.5, 'rgba(45, 110, 200, 0.05)');
            centerGlow.addColorStop(1, 'transparent');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, w, h);

            drawMountains(time);
        }

        function animate(time) {
            drawScene(time);
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // ================= FLOATING PARTICLES =================
        const particleContainer = document.getElementById('particles');
        for (let i = 0; i < 35; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 3.5 + 1.5;
            const left = Math.random() * 100;
            const duration = Math.random() * 9 + 7;
            const delay = Math.random() * 8;
            const drift = (Math.random() - 0.5) * 120;

            p.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                left: ${left}%;
                --drift: ${drift}px;
                animation-duration: ${duration}s;
                animation-delay: ${delay}s;
            `;
            particleContainer.appendChild(p);
        }

        // ================= BOTW SOUND SYNTHESIZER (Web Audio) =================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playBotwChime() {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                // Play a mysterious gentle piano-like pentatonic chord
                const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                freqs.forEach((f, idx) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
                        
                        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.2);
                        
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        
                        osc.start();
                        osc.stop(audioCtx.currentTime + 2.3);
                    }, idx * 110);
                });
            } catch (e) {
                // Audio fallback if unsupported
            }
        }

        // ================= INTERACTION & MENU =================
        const pressStart = document.getElementById('pressStart');
        const menu = document.getElementById('menu');
        const flash = document.getElementById('flash');
        const logo = document.getElementById('logoContainer');
        let started = false;

        function handleStart() {
            if (started) return;
            started = true;

            playBotwChime();

            // Flash Screen effect
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 180);

            // Switch to Menu
            pressStart.style.display = 'none';
            menu.style.display = 'flex';
        }

        window.addEventListener('keydown', handleStart);
        pressStart.addEventListener('click', handleStart);

        function selectOption(name) {
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 140);
            playBotwChime();
            console.log("Selected:", name);
        }

        // Gentle 3D Mouse Parallax
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 14;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            logo.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
